[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ap-automation"
version = "0.1.0"
description = "AI-powered Enterprise Accounts Payable (AP) Invoice Automation Platform"
readme = "docs/CLAUDE.md"
requires-python = ">=3.11"
authors = [
    { name = "Enterprise AP Solution Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "redis>=5.0.3",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "openai>=1.14.0",
    "azure-identity>=1.15.0",
    "azure-storage-blob>=12.19.0",
    "pymupdf>=1.24.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
    "fakeredis>=2.21.0",
    "ruff>=0.3.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -p no:logfire"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".agents",
    "scratch",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
